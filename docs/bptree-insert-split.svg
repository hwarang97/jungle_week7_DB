<svg width="960" viewBox="0 0 960 1250" xmlns="http://www.w3.org/2000/svg" style="font-family: -apple-system, 'Segoe UI', sans-serif; background: #fff;">

  <!-- order 명시 -->
  <rect x="720" y="12" width="200" height="28" rx="14" fill="#f8f8f6" stroke="#ddd" stroke-width="0.6"/>
  <text x="820" y="31" font-size="12" font-weight="500" fill="#555" text-anchor="middle">B+ Tree order = 4 (키 최대 3개)</text>

  <!-- ===== 1단계: 삽입 위치 탐색 ===== -->

  <circle cx="60" cy="50" r="18" fill="#185FA5"/>
  <text x="60" y="56" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="90" y="56" font-size="16" font-weight="600" fill="#333" text-anchor="start">삽입 위치 탐색</text>

  <!-- 삽입할 키 -->
  <rect x="720" y="46" width="160" height="32" rx="16" fill="#FFF3E0" stroke="#EF9F27" stroke-width="0.8"/>
  <text x="800" y="67" font-size="13" font-weight="500" fill="#854F0B" text-anchor="middle">삽입할 key: 25</text>

  <!-- 루트 [30 | 60] -->
  <rect x="380" y="90" width="140" height="42" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2"/>
  <text x="420" y="116" font-size="14" font-weight="600" fill="#0C447C" text-anchor="middle">30</text>
  <line x1="450" y1="90" x2="450" y2="132" stroke="#185FA5" stroke-width="0.4" opacity="0.4"/>
  <text x="480" y="116" font-size="14" font-weight="600" fill="#0C447C" text-anchor="middle">60</text>

  <!-- 탐색 화살표: 25 < 30 → 왼쪽 -->
  <line x1="410" y1="132" x2="300" y2="168" stroke="#185FA5" stroke-width="1.5"/>
  <polygon points="300,168 308,163 306,171" fill="#185FA5"/>
  <text x="335" y="155" font-size="11" fill="#185FA5" font-weight="500">25 &lt; 30 → 왼쪽</text>

  <!-- 내부 노드 [10 | 20] -->
  <rect x="200" y="175" width="140" height="42" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="240" y="201" font-size="14" font-weight="600" fill="#3C3489" text-anchor="middle">10</text>
  <line x1="270" y1="175" x2="270" y2="217" stroke="#534AB7" stroke-width="0.4" opacity="0.4"/>
  <text x="300" y="201" font-size="14" font-weight="600" fill="#3C3489" text-anchor="middle">20</text>

  <!-- 탐색 화살표: 25 > 20 → 오른쪽 자식 -->
  <line x1="320" y1="217" x2="380" y2="248" stroke="#185FA5" stroke-width="1.5"/>
  <polygon points="380,248 372,243 374,251" fill="#185FA5"/>
  <text x="325" y="243" font-size="11" fill="#185FA5" font-weight="500">25 &gt; 20 → 오른쪽</text>

  <!-- 리프 노드 [20, 22, 28] (목표 리프, 키 3개 = 꽉 참) -->
  <rect x="340" y="255" width="130" height="38" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2" stroke-dasharray="4 2"/>
  <text x="405" y="279" font-size="13" font-weight="600" fill="#085041" text-anchor="middle">20, 22, 28</text>
  <text x="405" y="310" font-size="11" fill="#0F6E56" text-anchor="middle">← 삽입 대상 리프 (이미 키 3개 = 꽉 참)</text>

  <!-- 구분선 -->
  <line x1="40" y1="335" x2="920" y2="335" stroke="#e8e8e4" stroke-width="1"/>

  <!-- ===== 2단계: 리프에 삽입 시도 → overflow ===== -->

  <circle cx="60" cy="370" r="18" fill="#185FA5"/>
  <text x="60" y="376" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="90" y="376" font-size="16" font-weight="600" fill="#333" text-anchor="start">리프에 삽입 시도 → overflow 발생</text>

  <!-- Before: 꽉 찬 리프 -->
  <text x="230" y="415" font-size="12" fill="#888" text-anchor="middle">현재 리프 (키 3개 = 최대)</text>
  <rect x="140" y="425" width="180" height="42" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="185" y="451" font-size="14" font-weight="600" fill="#085041" text-anchor="middle">20</text>
  <line x1="210" y1="425" x2="210" y2="467" stroke="#0F6E56" stroke-width="0.3" opacity="0.4"/>
  <text x="230" y="451" font-size="14" font-weight="600" fill="#085041" text-anchor="middle">22</text>
  <line x1="260" y1="425" x2="260" y2="467" stroke="#0F6E56" stroke-width="0.3" opacity="0.4"/>
  <text x="280" y="451" font-size="14" font-weight="600" fill="#085041" text-anchor="middle">28</text>

  <!-- 화살표 -->
  <text x="420" y="445" font-size="22" fill="#185FA5" text-anchor="middle">→</text>
  <text x="420" y="465" font-size="11" fill="#185FA5" text-anchor="middle">25 삽입 시도</text>

  <!-- After: overflow -->
  <text x="680" y="415" font-size="12" fill="#888" text-anchor="middle">정렬 삽입 → 키 4개 = overflow!</text>
  <rect x="560" y="425" width="240" height="42" rx="6" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.2"/>
  <text x="600" y="451" font-size="14" font-weight="600" fill="#501313" text-anchor="middle">20</text>
  <line x1="620" y1="425" x2="620" y2="467" stroke="#E24B4A" stroke-width="0.3" opacity="0.4"/>
  <text x="640" y="451" font-size="14" font-weight="600" fill="#501313" text-anchor="middle">22</text>
  <line x1="660" y1="425" x2="660" y2="467" stroke="#E24B4A" stroke-width="0.3" opacity="0.4"/>
  <text x="680" y="451" font-size="14" font-weight="600" fill="#EF9F27" text-anchor="middle">25</text>
  <line x1="700" y1="425" x2="700" y2="467" stroke="#E24B4A" stroke-width="0.3" opacity="0.4"/>
  <text x="760" y="451" font-size="14" font-weight="600" fill="#501313" text-anchor="middle">28</text>

  <text x="680" y="490" font-size="11" fill="#E24B4A" font-weight="500" text-anchor="middle">최대 3개인데 4개 → 분할 필요</text>

  <!-- 구분선 -->
  <line x1="40" y1="515" x2="920" y2="515" stroke="#e8e8e4" stroke-width="1"/>

  <!-- ===== 3단계: 리프 분할 ===== -->

  <circle cx="60" cy="550" r="18" fill="#185FA5"/>
  <text x="60" y="556" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="90" y="556" font-size="16" font-weight="600" fill="#333" text-anchor="start">리프 분할 (split)</text>

  <!-- overflow 노드 -->
  <text x="480" y="585" font-size="12" fill="#888" text-anchor="middle">overflow 상태 [20, 22, 25, 28]</text>
  <rect x="370" y="595" width="220" height="42" rx="6" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.8" stroke-dasharray="4 2"/>
  <text x="410" y="621" font-size="14" font-weight="600" fill="#791F1F" text-anchor="middle">20</text>
  <line x1="430" y1="595" x2="430" y2="637" stroke="#E24B4A" stroke-width="0.3" opacity="0.4"/>
  <text x="450" y="621" font-size="14" font-weight="600" fill="#791F1F" text-anchor="middle">22</text>
  <line x1="480" y1="595" x2="480" y2="637" stroke="#E24B4A" stroke-width="0.3" opacity="0.4"/>
  <text x="510" y="621" font-size="14" font-weight="600" fill="#791F1F" text-anchor="middle">25</text>
  <line x1="530" y1="595" x2="530" y2="637" stroke="#E24B4A" stroke-width="0.3" opacity="0.4"/>
  <text x="550" y="621" font-size="14" font-weight="600" fill="#791F1F" text-anchor="middle">28</text>

  <!-- 분할 설명 -->
  <text x="480" y="660" font-size="11" fill="#555" text-anchor="middle">중간 지점에서 반으로 나눔</text>

  <!-- 분할 화살표 -->
  <line x1="420" y1="670" x2="310" y2="710" stroke="#185FA5" stroke-width="1"/>
  <polygon points="310,710 318,705 316,713" fill="#185FA5"/>
  <line x1="540" y1="670" x2="620" y2="710" stroke="#185FA5" stroke-width="1"/>
  <polygon points="620,710 612,705 614,713" fill="#185FA5"/>
  <text x="480" y="698" font-size="12" fill="#185FA5" font-weight="500" text-anchor="middle">분할</text>

  <!-- 왼쪽 리프 -->
  <rect x="220" y="715" width="120" height="42" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="260" y="741" font-size="14" font-weight="600" fill="#085041" text-anchor="middle">20</text>
  <line x1="280" y1="715" x2="280" y2="757" stroke="#0F6E56" stroke-width="0.3" opacity="0.4"/>
  <text x="300" y="741" font-size="14" font-weight="600" fill="#085041" text-anchor="middle">22</text>
  <text x="280" y="775" font-size="11" fill="#555" text-anchor="middle">왼쪽 리프</text>

  <!-- 오른쪽 리프 -->
  <rect x="570" y="715" width="120" height="42" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="610" y="741" font-size="14" font-weight="600" fill="#085041" text-anchor="middle">25</text>
  <line x1="630" y1="715" x2="630" y2="757" stroke="#0F6E56" stroke-width="0.3" opacity="0.4"/>
  <text x="650" y="741" font-size="14" font-weight="600" fill="#085041" text-anchor="middle">28</text>
  <text x="630" y="775" font-size="11" fill="#555" text-anchor="middle">오른쪽 리프</text>

  <!-- next 포인터 -->
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <line x1="340" y1="736" x2="568" y2="736" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#arrowhead)"/>
  <text x="454" y="730" font-size="10" fill="#1D9E75" font-weight="500" text-anchor="middle">next 연결 유지</text>

  <!-- 부모로 올라가는 키 -->
  <line x1="610" y1="715" x2="610" y2="665" stroke="#EF9F27" stroke-width="1.2" stroke-dasharray="5 3"/>
  <polygon points="610,665 606,673 614,673" fill="#EF9F27"/>
  <rect x="640" y="685" width="240" height="28" rx="14" fill="#FFF3E0" stroke="#EF9F27" stroke-width="0.6"/>
  <text x="760" y="704" font-size="11" font-weight="500" fill="#854F0B" text-anchor="middle">오른쪽 리프의 첫 key(25)를 부모로</text>

  <!-- 구분선 -->
  <line x1="40" y1="800" x2="920" y2="800" stroke="#e8e8e4" stroke-width="1"/>

  <!-- ===== 4단계: 부모에 separator key 반영 ===== -->

  <circle cx="60" cy="835" r="18" fill="#185FA5"/>
  <text x="60" y="841" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">4</text>
  <text x="90" y="841" font-size="16" font-weight="600" fill="#333" text-anchor="start">부모에 separator key 반영</text>

  <!-- Before 부모 [10 | 20] -->
  <text x="230" y="880" font-size="12" fill="#888" text-anchor="middle">반영 전 (키 2개)</text>
  <rect x="150" y="890" width="140" height="40" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <line x1="220" y1="890" x2="220" y2="930" stroke="#534AB7" stroke-width="0.3" opacity="0.4"/>
  <text x="185" y="915" font-size="14" font-weight="600" fill="#3C3489" text-anchor="middle">10</text>
  <text x="255" y="915" font-size="14" font-weight="600" fill="#3C3489" text-anchor="middle">20</text>

  <!-- 화살표 -->
  <text x="410" y="910" font-size="22" fill="#185FA5" text-anchor="middle">→</text>
  <text x="410" y="930" font-size="11" fill="#EF9F27" font-weight="500" text-anchor="middle">25 삽입</text>

  <!-- After 부모 [10 | 20 | 25] (키 3개 = 최대, 꽉 찼지만 아직 OK) -->
  <text x="660" y="880" font-size="12" fill="#888" text-anchor="middle">반영 후 (키 3개 = 최대, 꽉 참)</text>
  <rect x="540" y="890" width="220" height="40" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
  <line x1="612" y1="890" x2="612" y2="930" stroke="#534AB7" stroke-width="0.3" opacity="0.4"/>
  <line x1="685" y1="890" x2="685" y2="930" stroke="#534AB7" stroke-width="0.3" opacity="0.4"/>
  <text x="576" y="915" font-size="14" font-weight="600" fill="#3C3489" text-anchor="middle">10</text>
  <text x="648" y="915" font-size="14" font-weight="600" fill="#3C3489" text-anchor="middle">20</text>
  <text x="720" y="915" font-size="14" font-weight="600" fill="#EF9F27" text-anchor="middle">25</text>

  <text x="650" y="952" font-size="10" fill="#534AB7" text-anchor="middle">키 3개 = order - 1. 다음 삽입 시 이 노드도 분할됨</text>

  <!-- 분할 후 트리 전체 모습 -->
  <text x="480" y="990" font-size="13" fill="#555" font-weight="500" text-anchor="middle">분할 완료 후 트리 구조</text>

  <!-- 루트 [30 | 60] -->
  <rect x="370" y="1010" width="140" height="40" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="420" y="1035" font-size="13" font-weight="600" fill="#0C447C" text-anchor="middle">30</text>
  <line x1="450" y1="1010" x2="450" y2="1050" stroke="#185FA5" stroke-width="0.3" opacity="0.4"/>
  <text x="480" y="1035" font-size="13" font-weight="600" fill="#0C447C" text-anchor="middle">60</text>

  <!-- 연결선 루트→내부 -->
  <line x1="400" y1="1050" x2="280" y2="1080" stroke="#999" stroke-width="0.6"/>
  <line x1="470" y1="1050" x2="550" y2="1080" stroke="#999" stroke-width="0.6"/>
  <line x1="500" y1="1050" x2="750" y2="1080" stroke="#999" stroke-width="0.6"/>

  <!-- 내부 노드 [10 | 20 | 25] (꽉 참) -->
  <rect x="180" y="1085" width="200" height="38" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="225" y="1109" font-size="12" font-weight="600" fill="#3C3489" text-anchor="middle">10</text>
  <line x1="253" y1="1085" x2="253" y2="1123" stroke="#534AB7" stroke-width="0.3" opacity="0.4"/>
  <text x="280" y="1109" font-size="12" font-weight="600" fill="#3C3489" text-anchor="middle">20</text>
  <line x1="308" y1="1085" x2="308" y2="1123" stroke="#534AB7" stroke-width="0.3" opacity="0.4"/>
  <text x="335" y="1109" font-size="12" font-weight="600" fill="#EF9F27" text-anchor="middle">25</text>

  <!-- 다른 내부 노드들 (비활성) -->
  <rect x="480" y="1085" width="100" height="38" rx="6" fill="#f8f8f6" stroke="#ddd" stroke-width="0.5"/>
  <text x="530" y="1109" font-size="11" fill="#bbb" text-anchor="middle">...</text>
  <rect x="680" y="1085" width="100" height="38" rx="6" fill="#f8f8f6" stroke="#ddd" stroke-width="0.5"/>
  <text x="730" y="1109" font-size="11" fill="#bbb" text-anchor="middle">...</text>

  <!-- 리프들 -->
  <line x1="210" y1="1123" x2="130" y2="1153" stroke="#999" stroke-width="0.5"/>
  <line x1="265" y1="1123" x2="250" y2="1153" stroke="#999" stroke-width="0.5"/>
  <line x1="320" y1="1123" x2="370" y2="1153" stroke="#999" stroke-width="0.5"/>
  <line x1="365" y1="1123" x2="490" y2="1153" stroke="#999" stroke-width="0.5"/>

  <rect x="80" y="1158" width="80" height="32" rx="5" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
  <text x="120" y="1179" font-size="10" font-weight="600" fill="#085041" text-anchor="middle">... , 8</text>

  <rect x="210" y="1158" width="80" height="32" rx="5" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
  <text x="250" y="1179" font-size="10" font-weight="600" fill="#085041" text-anchor="middle">20, 22</text>

  <rect x="340" y="1158" width="80" height="32" rx="5" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="380" y="1179" font-size="10" font-weight="700" fill="#085041" text-anchor="middle">25, 28</text>

  <rect x="470" y="1158" width="80" height="32" rx="5" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
  <text x="510" y="1179" font-size="10" font-weight="600" fill="#085041" text-anchor="middle">30, ...</text>

  <!-- next 포인터 -->
  <line x1="160" y1="1174" x2="208" y2="1174" stroke="#1D9E75" stroke-width="0.8" marker-end="url(#arrowhead)"/>
  <line x1="290" y1="1174" x2="338" y2="1174" stroke="#1D9E75" stroke-width="0.8" marker-end="url(#arrowhead)"/>
  <line x1="420" y1="1174" x2="468" y2="1174" stroke="#1D9E75" stroke-width="0.8" marker-end="url(#arrowhead)"/>

  <!-- 하단 주석 -->
  <rect x="230" y="1210" width="460" height="30" rx="15" fill="#f8f8f6" stroke="#ddd" stroke-width="0.5"/>
  <text x="460" y="1230" font-size="11" fill="#888" text-anchor="middle">부모 노드도 가득 차면 → 같은 방식으로 내부 노드 분할 반복 (재귀)</text>

</svg>