<svg width="960" viewBox="0 0 960 1150" xmlns="http://www.w3.org/2000/svg" style="font-family: -apple-system, 'Segoe UI', sans-serif; background: #fff;">

  <!-- ===== 1단계: 삽입 위치 탐색 ===== -->

  <!-- 단계 배지 -->
  <circle cx="60" cy="50" r="18" fill="#185FA5"/>
  <text x="60" y="56" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="90" y="56" font-size="16" font-weight="600" fill="#333" text-anchor="start">삽입 위치 탐색</text>

  <!-- 삽입할 키 표시 -->
  <rect x="720" y="36" width="160" height="32" rx="16" fill="#FFF3E0" stroke="#EF9F27" stroke-width="0.8"/>
  <text x="800" y="57" font-size="13" font-weight="500" fill="#854F0B" text-anchor="middle">삽입할 key: 25</text>

  <!-- 루트 [30] -->
  <rect x="420" y="85" width="80" height="40" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="460" y="110" font-size="14" font-weight="600" fill="#0C447C" text-anchor="middle">30</text>

  <!-- 탐색 화살표: 25 < 30 → 왼쪽 -->
  <line x1="440" y1="125" x2="310" y2="155" stroke="#185FA5" stroke-width="1.5"/>
  <polygon points="310,155 318,150 316,158" fill="#185FA5"/>
  <text x="355" y="145" font-size="11" fill="#185FA5" font-weight="500">25 &lt; 30 → 왼쪽</text>

  <!-- 내부 노드 [10 | 20] -->
  <rect x="220" y="160" width="130" height="40" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <line x1="285" y1="160" x2="285" y2="200" stroke="#534AB7" stroke-width="0.4" opacity="0.4"/>
  <text x="253" y="185" font-size="14" font-weight="600" fill="#3C3489" text-anchor="middle">10</text>
  <text x="318" y="185" font-size="14" font-weight="600" fill="#3C3489" text-anchor="middle">20</text>

  <!-- 탐색 화살표: 25 > 20 → 오른쪽 자식 -->
  <line x1="330" y1="200" x2="400" y2="230" stroke="#185FA5" stroke-width="1.5"/>
  <polygon points="400,230 392,225 394,233" fill="#185FA5"/>
  <text x="335" y="225" font-size="11" fill="#185FA5" font-weight="500">25 &gt; 20 → 오른쪽</text>

  <!-- 리프 노드 [20, 28] (목표 리프) -->
  <rect x="370" y="235" width="100" height="38" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2" stroke-dasharray="4 2"/>
  <text x="420" y="259" font-size="13" font-weight="600" fill="#085041" text-anchor="middle">20, 28</text>
  <text x="420" y="290" font-size="11" fill="#0F6E56" text-anchor="middle">← 삽입 대상 리프</text>

  <!-- 구분선 -->
  <line x1="40" y1="310" x2="920" y2="310" stroke="#e8e8e4" stroke-width="1"/>

  <!-- ===== 2단계: 리프에 정렬 삽입 ===== -->

  <circle cx="60" cy="345" r="18" fill="#185FA5"/>
  <text x="60" y="351" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="90" y="351" font-size="16" font-weight="600" fill="#333" text-anchor="start">리프에 정렬 삽입</text>

  <!-- Before -->
  <text x="240" y="390" font-size="12" fill="#888" text-anchor="middle">삽입 전</text>
  <rect x="170" y="400" width="140" height="42" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="210" y="426" font-size="14" font-weight="600" fill="#085041" text-anchor="middle">20</text>
  <line x1="240" y1="400" x2="240" y2="442" stroke="#0F6E56" stroke-width="0.3" opacity="0.4"/>
  <text x="270" y="426" font-size="14" font-weight="600" fill="#085041" text-anchor="middle">28</text>

  <!-- 화살표 -->
  <text x="420" y="420" font-size="22" fill="#185FA5" text-anchor="middle">→</text>
  <text x="420" y="440" font-size="11" fill="#185FA5" text-anchor="middle">25 삽입</text>

  <!-- After (overflow!) -->
  <text x="660" y="390" font-size="12" fill="#888" text-anchor="middle">삽입 후 (overflow!)</text>
  <rect x="560" y="400" width="200" height="42" rx="6" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.2"/>
  <text x="610" y="426" font-size="14" font-weight="600" fill="#501313" text-anchor="middle">20</text>
  <line x1="636" y1="400" x2="636" y2="442" stroke="#E24B4A" stroke-width="0.3" opacity="0.4"/>
  <text x="660" y="426" font-size="14" font-weight="600" fill="#501313" text-anchor="middle">25</text>
  <line x1="690" y1="400" x2="690" y2="442" stroke="#E24B4A" stroke-width="0.3" opacity="0.4"/>
  <text x="720" y="426" font-size="14" font-weight="600" fill="#501313" text-anchor="middle">28</text>

  <text x="660" y="465" font-size="11" fill="#E24B4A" font-weight="500" text-anchor="middle">정렬 유지 상태에서 최대 키 초과 → 분할 필요</text>

  <!-- 구분선 -->
  <line x1="40" y1="490" x2="920" y2="490" stroke="#e8e8e4" stroke-width="1"/>

  <!-- ===== 3단계: 리프 분할 ===== -->

  <circle cx="60" cy="525" r="18" fill="#185FA5"/>
  <text x="60" y="531" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="90" y="531" font-size="16" font-weight="600" fill="#333" text-anchor="start">리프 분할 (split)</text>

  <!-- overflow 노드 -->
  <text x="480" y="560" font-size="12" fill="#888" text-anchor="middle">overflow 상태</text>
  <rect x="380" y="570" width="200" height="42" rx="6" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.8" stroke-dasharray="4 2"/>
  <text x="430" y="596" font-size="14" font-weight="600" fill="#791F1F" text-anchor="middle">20</text>
  <line x1="456" y1="570" x2="456" y2="612" stroke="#E24B4A" stroke-width="0.3" opacity="0.4"/>
  <text x="480" y="596" font-size="14" font-weight="600" fill="#791F1F" text-anchor="middle">25</text>
  <line x1="510" y1="570" x2="510" y2="612" stroke="#E24B4A" stroke-width="0.3" opacity="0.4"/>
  <text x="535" y="596" font-size="14" font-weight="600" fill="#791F1F" text-anchor="middle">28</text>

  <!-- 분할 화살표 -->
  <line x1="430" y1="612" x2="310" y2="660" stroke="#185FA5" stroke-width="1"/>
  <polygon points="310,660 318,655 316,663" fill="#185FA5"/>
  <line x1="530" y1="612" x2="610" y2="660" stroke="#185FA5" stroke-width="1"/>
  <polygon points="610,660 602,655 604,663" fill="#185FA5"/>
  <text x="480" y="645" font-size="12" fill="#185FA5" font-weight="500" text-anchor="middle">분할</text>

  <!-- 왼쪽 리프 -->
  <rect x="240" y="665" width="100" height="42" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="290" y="691" font-size="14" font-weight="600" fill="#085041" text-anchor="middle">20</text>
  <text x="290" y="725" font-size="11" fill="#555" text-anchor="middle">왼쪽 리프</text>

  <!-- 오른쪽 리프 -->
  <rect x="560" y="665" width="120" height="42" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="600" y="691" font-size="14" font-weight="600" fill="#085041" text-anchor="middle">25</text>
  <line x1="620" y1="665" x2="620" y2="707" stroke="#0F6E56" stroke-width="0.3" opacity="0.4"/>
  <text x="650" y="691" font-size="14" font-weight="600" fill="#085041" text-anchor="middle">28</text>
  <text x="620" y="725" font-size="11" fill="#555" text-anchor="middle">오른쪽 리프</text>

  <!-- next 포인터 -->
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowup" viewBox="0 0 10 10" refX="5" refY="2" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 8L5 2L9 8" fill="none" stroke="#EF9F27" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <line x1="340" y1="686" x2="558" y2="686" stroke="#1D9E75" stroke-width="1.2" marker-end="url(#arrowhead)"/>
  <text x="450" y="680" font-size="10" fill="#1D9E75" font-weight="500" text-anchor="middle">next 연결 유지</text>

  <!-- 부모로 올라가는 키 표시 -->
  <line x1="600" y1="665" x2="600" y2="610" stroke="#EF9F27" stroke-width="1.2" stroke-dasharray="5 3"/>
  <polygon points="600,610 596,618 604,618" fill="#EF9F27"/>
  <rect x="630" y="630" width="220" height="28" rx="14" fill="#FFF3E0" stroke="#EF9F27" stroke-width="0.6"/>
  <text x="740" y="649" font-size="11" font-weight="500" fill="#854F0B" text-anchor="middle">오른쪽 리프의 첫 key(25)를 부모로</text>

  <!-- 구분선 -->
  <line x1="40" y1="750" x2="920" y2="750" stroke="#e8e8e4" stroke-width="1"/>

  <!-- ===== 4단계: 부모에 separator key 반영 ===== -->

  <circle cx="60" cy="785" r="18" fill="#185FA5"/>
  <text x="60" y="791" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">4</text>
  <text x="90" y="791" font-size="16" font-weight="600" fill="#333" text-anchor="start">부모에 separator key 반영</text>

  <!-- Before 부모 -->
  <text x="250" y="830" font-size="12" fill="#888" text-anchor="middle">반영 전</text>
  <rect x="170" y="840" width="130" height="40" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <line x1="235" y1="840" x2="235" y2="880" stroke="#534AB7" stroke-width="0.3" opacity="0.4"/>
  <text x="203" y="865" font-size="14" font-weight="600" fill="#3C3489" text-anchor="middle">10</text>
  <text x="268" y="865" font-size="14" font-weight="600" fill="#3C3489" text-anchor="middle">20</text>

  <!-- 화살표 -->
  <text x="420" y="860" font-size="22" fill="#185FA5" text-anchor="middle">→</text>
  <text x="420" y="878" font-size="11" fill="#EF9F27" font-weight="500" text-anchor="middle">25 삽입</text>

  <!-- After 부모 -->
  <text x="660" y="830" font-size="12" fill="#888" text-anchor="middle">반영 후</text>
  <rect x="560" y="840" width="200" height="40" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2"/>
  <line x1="626" y1="840" x2="626" y2="880" stroke="#534AB7" stroke-width="0.3" opacity="0.4"/>
  <line x1="693" y1="840" x2="693" y2="880" stroke="#534AB7" stroke-width="0.3" opacity="0.4"/>
  <text x="593" y="865" font-size="14" font-weight="600" fill="#3C3489" text-anchor="middle">10</text>
  <text x="660" y="865" font-size="14" font-weight="600" fill="#3C3489" text-anchor="middle">20</text>
  <text x="727" y="865" font-size="14" font-weight="600" fill="#EF9F27" text-anchor="middle">25</text>

  <!-- 분할 후 트리 모습 -->
  <text x="480" y="920" font-size="13" fill="#555" font-weight="500" text-anchor="middle">분할 완료 후 트리 구조</text>

  <!-- 부모 노드 -->
  <rect x="370" y="940" width="200" height="40" rx="6" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <line x1="436" y1="940" x2="436" y2="980" stroke="#534AB7" stroke-width="0.3" opacity="0.4"/>
  <line x1="503" y1="940" x2="503" y2="980" stroke="#534AB7" stroke-width="0.3" opacity="0.4"/>
  <text x="403" y="965" font-size="14" font-weight="600" fill="#3C3489" text-anchor="middle">10</text>
  <text x="470" y="965" font-size="14" font-weight="600" fill="#3C3489" text-anchor="middle">20</text>
  <text x="537" y="965" font-size="14" font-weight="600" fill="#EF9F27" text-anchor="middle">25</text>

  <!-- 자식 연결선 -->
  <line x1="403" y1="980" x2="260" y2="1020" stroke="#999" stroke-width="0.6"/>
  <line x1="470" y1="980" x2="430" y2="1020" stroke="#999" stroke-width="0.6"/>
  <line x1="537" y1="980" x2="600" y2="1020" stroke="#999" stroke-width="0.6"/>
  <line x1="555" y1="980" x2="760" y2="1020" stroke="#999" stroke-width="0.6"/>

  <!-- 리프들 -->
  <rect x="200" y="1025" width="90" height="36" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="245" y="1048" font-size="12" font-weight="600" fill="#085041" text-anchor="middle">... , 8</text>

  <rect x="380" y="1025" width="90" height="36" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="425" y="1048" font-size="12" font-weight="600" fill="#085041" text-anchor="middle">20</text>

  <rect x="550" y="1025" width="90" height="36" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
  <text x="595" y="1048" font-size="12" font-weight="600" fill="#085041" text-anchor="middle">25, 28</text>

  <rect x="720" y="1025" width="90" height="36" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="765" y="1048" font-size="12" font-weight="600" fill="#085041" text-anchor="middle">30, ...</text>

  <!-- next 포인터들 -->
  <line x1="290" y1="1043" x2="378" y2="1043" stroke="#1D9E75" stroke-width="1" marker-end="url(#arrowhead)"/>
  <line x1="470" y1="1043" x2="548" y2="1043" stroke="#1D9E75" stroke-width="1" marker-end="url(#arrowhead)"/>
  <line x1="640" y1="1043" x2="718" y2="1043" stroke="#1D9E75" stroke-width="1" marker-end="url(#arrowhead)"/>

  <!-- 주석: 부모도 overflow시 -->
  <rect x="270" y="1090" width="380" height="30" rx="15" fill="#f8f8f6" stroke="#ddd" stroke-width="0.5"/>
  <text x="460" y="1110" font-size="11" fill="#888" text-anchor="middle">부모 노드도 가득 차면 → 내부 노드 분할 반복 (재귀)</text>

</svg>