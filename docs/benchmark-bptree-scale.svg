<svg width="1400" height="880" viewBox="0 0 1400 880" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">B+ Tree Scale Benchmark</title>
  <desc id="desc">Comparison of B+ Tree insert, B+ Tree search, and linear search for 1000, 5000, and 10000 rows.</desc>

  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9fbff"/>
      <stop offset="100%" stop-color="#f4f7fb"/>
    </linearGradient>
    <linearGradient id="greenBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="blueBar2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="orangeBar2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#94a3b8" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1400" height="880" fill="url(#bg2)"/>
  <rect x="60" y="48" width="1280" height="784" rx="28" fill="#ffffff" filter="url(#shadow2)"/>

  <text x="110" y="110" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#0f172a">
    B+ Tree Scale Benchmark
  </text>
  <text x="110" y="148" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">
    현재 main 기준 `make bench-bptree-scale` 기본값. 1000회 반복 조회로 B+ Tree와 선형 탐색을 비교합니다.
  </text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">
    <rect x="882" y="92" width="22" height="22" rx="6" fill="url(#greenBar)"/>
    <text x="916" y="109" fill="#0f172a">B+ Tree insert</text>
    <rect x="1048" y="92" width="22" height="22" rx="6" fill="url(#blueBar2)"/>
    <text x="1082" y="109" fill="#0f172a">B+ Tree search</text>
    <rect x="1214" y="92" width="22" height="22" rx="6" fill="url(#orangeBar2)"/>
    <text x="1248" y="109" fill="#0f172a">linear search</text>
  </g>

  <g>
    <rect x="104" y="190" width="1192" height="430" rx="22" fill="#f8fafc" stroke="#e2e8f0"/>
    <line x1="180" y1="560" x2="1240" y2="560" stroke="#334155" stroke-width="2"/>
    <line x1="180" y1="220" x2="180" y2="560" stroke="#334155" stroke-width="2"/>

    <g font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#64748b">
      <line x1="180" y1="560" x2="1240" y2="560" stroke="#cbd5e1" stroke-width="1"/>
      <text x="138" y="565">0ms</text>

      <line x1="180" y1="492" x2="1240" y2="492" stroke="#e2e8f0" stroke-width="1"/>
      <text x="130" y="497">0.3ms</text>

      <line x1="180" y1="424" x2="1240" y2="424" stroke="#e2e8f0" stroke-width="1"/>
      <text x="130" y="429">0.6ms</text>

      <line x1="180" y1="356" x2="1240" y2="356" stroke="#e2e8f0" stroke-width="1"/>
      <text x="130" y="361">0.9ms</text>

      <line x1="180" y1="288" x2="1240" y2="288" stroke="#e2e8f0" stroke-width="1"/>
      <text x="130" y="293">1.2ms</text>

      <line x1="180" y1="220" x2="1240" y2="220" stroke="#e2e8f0" stroke-width="1"/>
      <text x="130" y="225">1.5ms</text>
    </g>

    <g>
      <text x="370" y="604" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0f172a">1,000건</text>
      <rect x="272" y="539.6" width="54" height="20.4" rx="8" fill="url(#greenBar)"/>
      <rect x="338" y="545.8" width="54" height="14.2" rx="8" fill="url(#blueBar2)"/>
      <rect x="404" y="512.7" width="54" height="47.3" rx="8" fill="url(#orangeBar2)"/>
      <text x="299" y="526" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#059669">0.072</text>
      <text x="365" y="532" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#2563eb">0.050</text>
      <text x="431" y="499" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#b45309">0.167</text>
    </g>

    <g>
      <text x="710" y="604" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0f172a">5,000건</text>
      <rect x="612" y="458.0" width="54" height="102.0" rx="8" fill="url(#greenBar)"/>
      <rect x="678" y="539.6" width="54" height="20.4" rx="8" fill="url(#blueBar2)"/>
      <rect x="744" y="330.9" width="54" height="229.1" rx="8" fill="url(#orangeBar2)"/>
      <text x="639" y="444" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#059669">0.360</text>
      <text x="705" y="526" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#2563eb">0.072</text>
      <text x="771" y="317" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#b45309">0.809</text>
    </g>

    <g>
      <text x="1050" y="604" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0f172a">10,000건</text>
      <rect x="952" y="341.9" width="54" height="218.1" rx="8" fill="url(#greenBar)"/>
      <rect x="1018" y="538.8" width="54" height="21.2" rx="8" fill="url(#blueBar2)"/>
      <rect x="1084" y="123.4" width="54" height="436.6" rx="8" fill="url(#orangeBar2)"/>
      <text x="979" y="328" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#059669">0.770</text>
      <text x="1045" y="525" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#2563eb">0.075</text>
      <text x="1111" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#b45309">1.543</text>
    </g>
  </g>

  <g>
    <rect x="104" y="648" width="368" height="128" rx="20" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="132" y="692" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#047857">핵심 해석 1</text>
    <text x="132" y="725" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1e293b">
      insert 비용은 search보다 크지만
    </text>
    <text x="132" y="750" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1e293b">
      현재 기본 범위에서는 완만하게 증가합니다.
    </text>
  </g>

  <g>
    <rect x="516" y="648" width="368" height="128" rx="20" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="544" y="692" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">핵심 해석 2</text>
    <text x="544" y="725" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1e293b">
      B+ Tree search는 row 수가 커져도
    </text>
    <text x="544" y="750" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1e293b">
      매우 낮은 수준으로 유지됩니다.
    </text>
  </g>

  <g>
    <rect x="928" y="648" width="368" height="128" rx="20" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="956" y="692" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#c2410c">핵심 해석 3</text>
    <text x="956" y="725" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1e293b">
      linear search는 row 수 증가에 따라
    </text>
    <text x="956" y="750" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1e293b">
      더 가파르게 느려지는 차이를 보입니다.
    </text>
  </g>
</svg>
