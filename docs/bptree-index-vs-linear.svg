<svg width="960" viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" style="font-family: -apple-system, 'Segoe UI', sans-serif; background: #fff;">

  <defs>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#993C1D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 중앙 구분선 -->
  <line x1="480" y1="20" x2="480" y2="560" stroke="#e0e0dc" stroke-width="1"/>

  <!-- ===== 왼쪽 패널: WHERE id = ? ===== -->

  <!-- 배지 -->
  <rect x="120" y="24" width="240" height="36" rx="18" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="240" y="47" font-size="15" font-weight="600" fill="#085041" text-anchor="middle">WHERE id = ?</text>

  <!-- 부제 -->
  <text x="240" y="82" font-size="12" fill="#0F6E56" font-weight="500" text-anchor="middle">인덱스 사용 · O(log n)</text>

  <!-- SQL 입력 -->
  <rect x="160" y="105" width="160" height="36" rx="6" fill="#f8f8f6" stroke="#ccc" stroke-width="0.6"/>
  <text x="240" y="128" font-size="11" fill="#555" text-anchor="middle" font-family="'SF Mono', monospace">SELECT ... WHERE id=45</text>

  <line x1="240" y1="141" x2="240" y2="162" stroke="#0F6E56" stroke-width="1.2" marker-end="url(#arr-green)"/>

  <!-- Parser + Executor (합침) -->
  <rect x="175" y="167" width="130" height="34" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/>
  <text x="240" y="189" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">Parser → Executor</text>

  <line x1="240" y1="201" x2="240" y2="222" stroke="#0F6E56" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <text x="310" y="216" font-size="10" fill="#0F6E56">id 조건 감지</text>

  <!-- B+ Tree 탐색 영역 -->
  <rect x="80" y="228" width="320" height="220" rx="10" fill="#f9fdfb" stroke="#0F6E56" stroke-width="0.6" stroke-dasharray="5 3"/>
  <text x="240" y="250" font-size="11" fill="#0F6E56" font-weight="500" text-anchor="middle">B+ Tree 인덱스 탐색</text>

  <!-- 루트 -->
  <rect x="205" y="265" width="70" height="28" rx="5" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/>
  <text x="240" y="284" font-size="11" font-weight="600" fill="#085041" text-anchor="middle">30 | 70</text>

  <!-- 탐색 화살표 루트→내부 -->
  <line x1="225" y1="293" x2="180" y2="315" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="185" y="305" font-size="9" fill="#0F6E56">45 &gt; 30</text>

  <!-- 비활성 경로 -->
  <line x1="255" y1="293" x2="300" y2="315" stroke="#ddd" stroke-width="0.6"/>

  <!-- 내부 노드 -->
  <rect x="130" y="320" width="80" height="28" rx="5" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/>
  <text x="170" y="339" font-size="11" font-weight="600" fill="#085041" text-anchor="middle">40 | 55</text>

  <!-- 비활성 내부 -->
  <rect x="270" y="320" width="80" height="28" rx="5" fill="#f8f8f6" stroke="#ddd" stroke-width="0.5"/>
  <text x="310" y="339" font-size="10" fill="#ccc" text-anchor="middle">80 | 90</text>

  <!-- 내부→리프 -->
  <line x1="165" y1="348" x2="165" y2="375" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="185" y="367" font-size="9" fill="#0F6E56">40≤45</text>

  <!-- 리프 (목표) -->
  <rect x="120" y="380" width="90" height="28" rx="5" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2"/>
  <text x="165" y="399" font-size="11" font-weight="700" fill="#085041" text-anchor="middle">40, 45, 50</text>

  <!-- 비활성 리프들 -->
  <rect x="230" y="380" width="70" height="28" rx="5" fill="#f8f8f6" stroke="#ddd" stroke-width="0.5"/>
  <text x="265" y="399" font-size="9" fill="#ccc" text-anchor="middle">55, 60</text>

  <rect x="315" y="380" width="70" height="28" rx="5" fill="#f8f8f6" stroke="#ddd" stroke-width="0.5"/>
  <text x="350" y="399" font-size="9" fill="#ccc" text-anchor="middle">80, 85</text>

  <!-- 45 발견 표시 -->
  <text x="165" y="425" font-size="10" fill="#0F6E56" font-weight="500" text-anchor="middle">key 45 발견!</text>

  <!-- 결과 반환 -->
  <line x1="240" y1="448" x2="240" y2="476" stroke="#0F6E56" stroke-width="1.2" marker-end="url(#arr-green)"/>

  <rect x="160" y="480" width="160" height="36" rx="18" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="240" y="503" font-size="12" font-weight="600" fill="#085041" text-anchor="middle">결과 반환</text>

  <!-- 노드 방문 횟수 -->
  <rect x="140" y="530" width="200" height="26" rx="13" fill="#f8f8f6" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="240" y="548" font-size="11" fill="#0F6E56" text-anchor="middle">노드 3회 방문으로 검색 완료</text>

  <!-- ===== 오른쪽 패널: WHERE name = ? ===== -->

  <!-- 배지 -->
  <rect x="600" y="24" width="240" height="36" rx="18" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
  <text x="720" y="47" font-size="15" font-weight="600" fill="#712B13" text-anchor="middle">WHERE name = ?</text>

  <!-- 부제 -->
  <text x="720" y="82" font-size="12" fill="#993C1D" font-weight="500" text-anchor="middle">인덱스 없음 · O(n)</text>

  <!-- SQL 입력 -->
  <rect x="620" y="105" width="200" height="36" rx="6" fill="#f8f8f6" stroke="#ccc" stroke-width="0.6"/>
  <text x="720" y="128" font-size="11" fill="#555" text-anchor="middle" font-family="'SF Mono', monospace">SELECT ... WHERE name='sein'</text>

  <line x1="720" y1="141" x2="720" y2="162" stroke="#993C1D" stroke-width="1.2" marker-end="url(#arr-red)"/>

  <!-- Parser + Executor -->
  <rect x="655" y="167" width="130" height="34" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.6"/>
  <text x="720" y="189" font-size="12" font-weight="500" fill="#0C447C" text-anchor="middle">Parser → Executor</text>

  <line x1="720" y1="201" x2="720" y2="222" stroke="#993C1D" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <text x="790" y="216" font-size="10" fill="#993C1D">name → 인덱스 없음</text>

  <!-- 선형 탐색 영역 -->
  <rect x="540" y="228" width="360" height="220" rx="10" fill="#fefaf8" stroke="#993C1D" stroke-width="0.6" stroke-dasharray="5 3"/>
  <text x="720" y="250" font-size="11" fill="#993C1D" font-weight="500" text-anchor="middle">선형 탐색 (전체 스캔)</text>

  <!-- 레코드 행들 -->
  <!-- rec 0 -->
  <rect x="570" y="268" width="300" height="24" rx="4" fill="#FAECE7" stroke="#D85A30" stroke-width="0.4"/>
  <text x="585" y="285" font-size="10" fill="#712B13">id:1</text>
  <text x="640" y="285" font-size="10" fill="#712B13">name: jiun</text>
  <text x="830" y="285" font-size="10" fill="#993C1D" font-weight="500">≠ sein</text>

  <!-- rec 1 -->
  <rect x="570" y="298" width="300" height="24" rx="4" fill="#FAECE7" stroke="#D85A30" stroke-width="0.4"/>
  <text x="585" y="315" font-size="10" fill="#712B13">id:2</text>
  <text x="640" y="315" font-size="10" fill="#712B13">name: minsuk</text>
  <text x="830" y="315" font-size="10" fill="#993C1D" font-weight="500">≠ sein</text>

  <!-- rec 2 -->
  <rect x="570" y="328" width="300" height="24" rx="4" fill="#FAECE7" stroke="#D85A30" stroke-width="0.4"/>
  <text x="585" y="345" font-size="10" fill="#712B13">id:3</text>
  <text x="640" y="345" font-size="10" fill="#712B13">name: seokje</text>
  <text x="830" y="345" font-size="10" fill="#993C1D" font-weight="500">≠ sein</text>

  <!-- ... 생략 표시 -->
  <text x="720" y="372" font-size="12" fill="#993C1D" text-anchor="middle">⋮   (n번째까지 계속 비교)   ⋮</text>

  <!-- rec n (일치) -->
  <rect x="570" y="388" width="300" height="24" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="585" y="405" font-size="10" fill="#085041">id:999</text>
  <text x="640" y="405" font-size="10" fill="#085041" font-weight="600">name: sein</text>
  <text x="830" y="405" font-size="10" fill="#0F6E56" font-weight="600">= sein ✓</text>

  <!-- 나머지도 계속 -->
  <rect x="570" y="418" width="300" height="24" rx="4" fill="#FAECE7" stroke="#D85A30" stroke-width="0.4" opacity="0.5"/>
  <text x="720" y="435" font-size="10" fill="#993C1D" text-anchor="middle" opacity="0.6">나머지 레코드도 끝까지 확인...</text>

  <!-- 결과 반환 -->
  <line x1="720" y1="448" x2="720" y2="476" stroke="#993C1D" stroke-width="1.2" marker-end="url(#arr-red)"/>

  <rect x="640" y="480" width="160" height="36" rx="18" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
  <text x="720" y="503" font-size="12" font-weight="600" fill="#712B13" text-anchor="middle">결과 반환</text>

  <!-- 레코드 확인 횟수 -->
  <rect x="610" y="530" width="220" height="26" rx="13" fill="#f8f8f6" stroke="#993C1D" stroke-width="0.5"/>
  <text x="720" y="548" font-size="11" fill="#993C1D" text-anchor="middle">전체 레코드를 하나씩 모두 확인</text>

  <!-- ===== 하단 요약 ===== -->
  <rect x="100" y="580" width="760" height="32" rx="16" fill="#f8f8f6" stroke="#ddd" stroke-width="0.6"/>
  <text x="480" y="601" font-size="12" fill="#555" text-anchor="middle">id 기준 조회는 B+ Tree 인덱스 O(log n)  ·  다른 컬럼 조회는 선형 탐색 O(n)</text>

</svg>