<svg width="1400" height="920" viewBox="0 0 1400 920" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">SQL Benchmark Comparison</title>
  <desc id="desc">Log-scale comparison of indexed id lookup and linear name scan for 10,000, 100,000, and 1,000,000 rows.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="blueBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="orangeBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#94a3b8" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1400" height="920" fill="url(#bg)"/>
  <rect x="60" y="48" width="1280" height="824" rx="28" fill="#ffffff" filter="url(#shadow)"/>

  <text x="110" y="110" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#0f172a">
    SQL Benchmark: id 인덱스 검색 vs name 선형 탐색
  </text>
  <text x="110" y="148" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">
    현재 main 기준 `make bench-sql-index` 기본값. order=64, id lookup 500회, name lookup 500회 기준으로 측정했습니다.
  </text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">
    <rect x="888" y="92" width="22" height="22" rx="6" fill="url(#blueBar)"/>
    <text x="922" y="109" fill="#0f172a">id 검색 (B+ Tree)</text>
    <rect x="1080" y="92" width="22" height="22" rx="6" fill="url(#orangeBar)"/>
    <text x="1114" y="109" fill="#0f172a">name 검색 (선형)</text>
  </g>

  <g>
    <rect x="104" y="190" width="1192" height="470" rx="22" fill="#f8fafc" stroke="#e2e8f0"/>

    <text x="132" y="228" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#334155">
      시간 축은 큰 차이를 한 화면에서 보기 위해 로그 스케일(log10)로 표시했습니다.
    </text>

    <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#64748b">
      <line x1="220" y1="260" x2="220" y2="610" stroke="#cbd5e1" stroke-width="1"/>
      <text x="220" y="635" text-anchor="middle">0.01ms</text>

      <line x1="365" y1="260" x2="365" y2="610" stroke="#e2e8f0" stroke-width="1"/>
      <text x="365" y="635" text-anchor="middle">0.1ms</text>

      <line x1="510" y1="260" x2="510" y2="610" stroke="#e2e8f0" stroke-width="1"/>
      <text x="510" y="635" text-anchor="middle">1ms</text>

      <line x1="655" y1="260" x2="655" y2="610" stroke="#e2e8f0" stroke-width="1"/>
      <text x="655" y="635" text-anchor="middle">10ms</text>

      <line x1="800" y1="260" x2="800" y2="610" stroke="#e2e8f0" stroke-width="1"/>
      <text x="800" y="635" text-anchor="middle">100ms</text>

      <line x1="945" y1="260" x2="945" y2="610" stroke="#e2e8f0" stroke-width="1"/>
      <text x="945" y="635" text-anchor="middle">1000ms</text>

      <line x1="1090" y1="260" x2="1090" y2="610" stroke="#e2e8f0" stroke-width="1"/>
      <text x="1090" y="635" text-anchor="middle">10000ms</text>
    </g>

    <line x1="220" y1="610" x2="1180" y2="610" stroke="#334155" stroke-width="2"/>

    <g font-family="Arial, Helvetica, sans-serif">
      <text x="148" y="320" font-size="22" font-weight="700" fill="#0f172a">10,000 rows</text>
      <rect x="220" y="286" width="493" height="22" rx="11" fill="url(#blueBar)"/>
      <text x="726" y="302" font-size="14" font-weight="700" fill="#1d4ed8">24.850ms</text>
      <rect x="220" y="322" width="624" height="22" rx="11" fill="url(#orangeBar)"/>
      <text x="857" y="338" font-size="14" font-weight="700" fill="#c2410c">199.026ms</text>
      <rect x="1108" y="292" width="140" height="48" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="1178" y="312" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">speedup</text>
      <text x="1178" y="332" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">8.01x</text>

      <text x="148" y="438" font-size="22" font-weight="700" fill="#0f172a">100,000 rows</text>
      <rect x="220" y="404" width="438" height="22" rx="11" fill="url(#blueBar)"/>
      <text x="671" y="420" font-size="14" font-weight="700" fill="#1d4ed8">10.362ms</text>
      <rect x="220" y="440" width="765" height="22" rx="11" fill="url(#orangeBar)"/>
      <text x="998" y="456" font-size="14" font-weight="700" fill="#c2410c">1865.738ms</text>
      <rect x="1108" y="410" width="140" height="48" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="1178" y="430" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">speedup</text>
      <text x="1178" y="450" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">180.05x</text>

      <text x="148" y="556" font-size="22" font-weight="700" fill="#0f172a">1,000,000 rows</text>
      <rect x="220" y="522" width="428" height="22" rx="11" fill="url(#blueBar)"/>
      <text x="661" y="538" font-size="14" font-weight="700" fill="#1d4ed8">8.868ms</text>
      <rect x="220" y="558" width="907" height="22" rx="11" fill="url(#orangeBar)"/>
      <text x="1140" y="574" font-size="14" font-weight="700" fill="#c2410c">17889.915ms</text>
      <rect x="1108" y="528" width="140" height="48" rx="16" fill="#dbeafe" stroke="#93c5fd"/>
      <text x="1178" y="548" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">speedup</text>
      <text x="1178" y="568" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">2017.36x</text>
    </g>
  </g>

  <g>
    <rect x="104" y="698" width="368" height="128" rx="20" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="132" y="742" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">핵심 해석 1</text>
    <text x="132" y="775" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1e293b">
      row 수가 커질수록 id 인덱스 조회와
    </text>
    <text x="132" y="800" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1e293b">
      name 선형 탐색의 차이가 빠르게 벌어집니다.
    </text>
  </g>

  <g>
    <rect x="516" y="698" width="368" height="128" rx="20" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="544" y="742" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#c2410c">핵심 해석 2</text>
    <text x="544" y="775" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1e293b">
      1,000,000 rows에서는 id 조회가
    </text>
    <text x="544" y="800" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1e293b">
      name 조회보다 약 2017배 더 빨랐습니다.
    </text>
  </g>

  <g>
    <rect x="928" y="698" width="368" height="128" rx="20" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="956" y="742" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a">핵심 해석 3</text>
    <text x="956" y="775" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1e293b">
      같은 SQL 처리기 경로 안에서 인덱스 유무만
    </text>
    <text x="956" y="800" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1e293b">
      바꿔도 성능 차이가 크게 난다는 점을 보여줍니다.
    </text>
  </g>
</svg>
