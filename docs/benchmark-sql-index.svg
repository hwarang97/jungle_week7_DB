<svg width="1400" height="880" viewBox="0 0 1400 880" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">SQL Benchmark Comparison</title>
  <desc id="desc">Comparison of B+ Tree indexed id lookup and linear name scan for 20, 80, and 160 rows.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="blueBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="orangeBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#94a3b8" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1400" height="880" fill="url(#bg)"/>
  <rect x="60" y="48" width="1280" height="784" rx="28" fill="#ffffff" filter="url(#shadow)"/>

  <text x="110" y="110" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#0f172a">
    SQL Benchmark: id 인덱스 검색 vs name 선형 탐색
  </text>
  <text x="110" y="148" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">
    현재 main 기준 `make bench-sql-index` 기본값. 20회 lookup으로 빠르게 비교하는 데모용 benchmark입니다.
  </text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">
    <rect x="1010" y="92" width="22" height="22" rx="6" fill="url(#blueBar)"/>
    <text x="1044" y="109" fill="#0f172a">id 검색 (B+ Tree)</text>
    <rect x="1190" y="92" width="22" height="22" rx="6" fill="url(#orangeBar)"/>
    <text x="1224" y="109" fill="#0f172a">name 검색 (선형)</text>
  </g>

  <g>
    <rect x="104" y="190" width="1192" height="430" rx="22" fill="#f8fafc" stroke="#e2e8f0"/>
    <line x1="180" y1="560" x2="1240" y2="560" stroke="#334155" stroke-width="2"/>
    <line x1="180" y1="220" x2="180" y2="560" stroke="#334155" stroke-width="2"/>

    <g font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#64748b">
      <line x1="180" y1="560" x2="1240" y2="560" stroke="#cbd5e1" stroke-width="1"/>
      <text x="138" y="565">0ms</text>

      <line x1="180" y1="492" x2="1240" y2="492" stroke="#e2e8f0" stroke-width="1"/>
      <text x="130" y="497">0.6ms</text>

      <line x1="180" y1="424" x2="1240" y2="424" stroke="#e2e8f0" stroke-width="1"/>
      <text x="124" y="429">1.2ms</text>

      <line x1="180" y1="356" x2="1240" y2="356" stroke="#e2e8f0" stroke-width="1"/>
      <text x="124" y="361">1.8ms</text>

      <line x1="180" y1="288" x2="1240" y2="288" stroke="#e2e8f0" stroke-width="1"/>
      <text x="124" y="293">2.4ms</text>

      <line x1="180" y1="220" x2="1240" y2="220" stroke="#e2e8f0" stroke-width="1"/>
      <text x="124" y="225">3.0ms</text>
    </g>

    <g>
      <text x="370" y="604" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0f172a">20건</text>
      <rect x="300" y="422.8" width="62" height="137.2" rx="8" fill="url(#blueBar)"/>
      <rect x="380" y="302.1" width="62" height="257.9" rx="8" fill="url(#orangeBar)"/>
      <text x="331" y="409" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2563eb">1.211ms</text>
      <text x="411" y="288" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#b45309">2.276ms</text>
    </g>

    <g>
      <text x="710" y="604" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0f172a">80건</text>
      <rect x="640" y="426.0" width="62" height="134.0" rx="8" fill="url(#blueBar)"/>
      <rect x="720" y="368.4" width="62" height="191.6" rx="8" fill="url(#orangeBar)"/>
      <text x="671" y="412" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2563eb">1.183ms</text>
      <text x="751" y="354" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#b45309">1.691ms</text>
    </g>

    <g>
      <text x="1050" y="604" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0f172a">160건</text>
      <rect x="980" y="430.5" width="62" height="129.5" rx="8" fill="url(#blueBar)"/>
      <rect x="1060" y="271.5" width="62" height="288.5" rx="8" fill="url(#orangeBar)"/>
      <text x="1011" y="417" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#2563eb">1.143ms</text>
      <text x="1091" y="258" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#b45309">2.545ms</text>
    </g>
  </g>

  <g>
    <rect x="104" y="648" width="368" height="128" rx="20" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="132" y="692" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1d4ed8">핵심 해석 1</text>
    <text x="132" y="725" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1e293b">
      기본 benchmark에서도 id 조회는
    </text>
    <text x="132" y="750" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1e293b">
      name 조회보다 꾸준히 더 빠르게 측정됩니다.
    </text>
  </g>

  <g>
    <rect x="516" y="648" width="368" height="128" rx="20" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="544" y="692" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#c2410c">핵심 해석 2</text>
    <text x="544" y="725" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1e293b">
      현재 기본 row count는 작지만
    </text>
    <text x="544" y="750" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1e293b">
      선형 탐색이 더 느린 경향은 이미 확인됩니다.
    </text>
  </g>

  <g>
    <rect x="928" y="648" width="368" height="128" rx="20" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="956" y="692" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0f172a">핵심 해석 3</text>
    <text x="956" y="725" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1e293b">
      더 큰 실험이 필요하면 macro를 바꿔
    </text>
    <text x="956" y="750" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1e293b">
      row 수와 lookup 수를 확장할 수 있습니다.
    </text>
  </g>
</svg>
